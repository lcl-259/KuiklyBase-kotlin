# 给工作流起个名字
name: test-actions

# 触发条件：代码推送到任何分支时执行
on: [push]

# 定义要执行的任务（Job），多个 job 默认并行执行
jobs:
  # 任务1：名叫 say-hello
  say-hello:
    # 运行环境：用 GitHub 免费的 Ubuntu 最新版
    runs-on: ubuntu-latest

    # 任务里的具体步骤（Step）
    steps:
      # 步骤1：打印一句话
      - name: Say Hello
        run: echo "Hello, GitHub Actions!"

      # 步骤2：打印系统信息
      - name: Check system info
        run: |
          echo "正在运行的系统："
          uname -a

  # 任务2：编译 kotlin-native dist，需要 macOS + Xcode 环境
  build-kotlin-native:
    runs-on: macos-latest
    steps:
      # 拉取代码到 runner（必须，否则找不到 gradlew）
      - name: 检出代码
        uses: actions/checkout@v4

      # 列出可用的 Xcode 版本，确认 Xcode-15.0 存在
      - name: 查看可用 Xcode 版本
        run: ls /Applications/ | grep Xcode

      # 用 Xcode 15 工具链编译，避免新版 ld 的兼容性问题
      - name: 编译 kotlin-native dist
        run: DEVELOPER_DIR=/Applications/Xcode-15.0.app/Contents/Developer ./gradlew :kotlin-native:dist